name: Flutter quality gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.9'
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14.6'

      - name: Verify embedded Python archive and manifest
        run: python tooling/package_python_runtime.py --check

      - name: Verify roadmap evidence index
        run: python tooling/verify_roadmap_evidence.py --report build/roadmap-evidence-report.json

      - name: Compile Python sources
        run: python -m compileall -q python_src tooling

      - name: Run Python runtime tests
        run: python -m unittest discover -s python_src -p 'test_*.py'

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze Dart
        run: flutter analyze --no-pub

      - name: Run Dart and widget tests
        run: flutter test --no-pub

      - name: Build web
        run: flutter build web --no-pub

      - name: Build debug APK
        run: flutter build apk --debug --no-pub

      - name: Verify unsigned release is rejected
        shell: bash
        run: |
          set +e
          output=$(flutter build appbundle --release --no-pub 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -ne 0
          printf '%s\n' "$output" | grep -F "Release signing is not configured"

      - name: Create artifact checksums
        shell: bash
        run: |
          {
            sha256sum app/app.zip
            sha256sum app/runtime_manifest.json
            sha256sum assets/curriculum/manifest.json
            sha256sum build/app/outputs/flutter-apk/app-debug.apk
          } | tee build/python-forge-artifact-sha256.txt

      - name: Upload validation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-forge-quality-${{ github.sha }}
          if-no-files-found: error
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/python-forge-artifact-sha256.txt
            build/roadmap-evidence-report.json
            app/app.zip
            app/runtime_manifest.json
            assets/curriculum/manifest.json
