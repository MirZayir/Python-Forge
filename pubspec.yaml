name: python_forge
description: "A gamified, interactive Python learning app built with Flutter."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^13.2.0
  shared_preferences: ^2.5.3
  serious_python: ^1.0.1
  crypto: 3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/curriculum/missions.json
    - assets/curriculum/manifest.json
    - app/app.zip
    - app/runtime_manifest.json

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/forge_icon.png"